[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "argos-probability-intelligence"
version = "0.0.0"
description = "Replayable probability intelligence research core for Polymarket"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.6",
  "httpx>=0.27",
  "orjson>=3.10",
  "psutil>=6.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "tenacity>=9.0",
  "typer>=0.12",
  "websockets>=13.0",
  "tzdata; sys_platform == 'win32'",
]

[project.scripts]
argos = "argos.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.115",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "respx>=0.21",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
packages = ["argos"]
