name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
