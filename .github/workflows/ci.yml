name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      # Separate from the step above, and only here: docs/13_TEST_STRATEGY.md
      # declares per-area branch-coverage thresholds that were unverifiable
      # until pytest-cov landed. Running the suite under coverage costs roughly
      # 8x its normal wall time, which is why the local gate keeps it behind
      # `--coverage` and CI carries it instead.
      - name: Branch coverage thresholds
        if: runner.os == 'Linux'
        run: uv run python scripts/claude/quality_gate.py --coverage
